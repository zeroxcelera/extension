<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Celera popup mockup</title>
    <style>
      :root {
        --bg: #0b0e13;
        --surface: #12161e;
        --surface-2: #181d27;
        --border: #252b37;
        --border-strong: #343c4c;
        --text: #e7e9ee;
        --muted: #8a93a4;
        --faint: #5d6575;
        --accent: #f5c84c;
        --accent-ink: #1a1405;
        --buy: #22c55e;
        --sell: #f05252;
        --warn: #f59e0b;
        --focus: #7aa2ff;
        --teal: #14b8a6;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: #05070a;
        color: var(--text);
        font:
          13px/1.45 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      h1.page {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.lead {
        margin: 0 0 20px;
        color: var(--muted);
        max-width: 900px;
      }
      .screens {
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
        max-width: 360px;
      }
      figcaption b {
        color: var(--text);
      }

      /* popup frame */
      .pop {
        width: 360px;
        height: 600px;
        background: var(--bg);
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        color: var(--accent);
        font-weight: 750;
        font-size: 15px;
      }
      .sp {
        flex: 1;
      }
      .ib {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        color: var(--muted);
        border-radius: 8px;
      }
      .chainsel {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        background: var(--surface);
        font-weight: 600;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .content {
        overflow: auto;
        padding: 12px;
        display: grid;
        align-content: start;
        gap: 12px;
      }

      /* bottom nav */
      .nav {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--border);
        background: #0d1117;
      }
      .nav a {
        display: grid;
        justify-items: center;
        gap: 3px;
        padding: 8px 0 10px;
        color: var(--faint);
        text-decoration: none;
        font-size: 11px;
        font-weight: 600;
        position: relative;
      }
      .nav a.on {
        color: var(--accent);
      }
      .nav a.on::before {
        content: '';
        position: absolute;
        top: 0;
        left: 30%;
        right: 30%;
        height: 2px;
        background: var(--accent);
        border-radius: 0 0 2px 2px;
      }
      .nav svg {
        width: 20px;
        height: 20px;
      }
      .badge {
        position: absolute;
        top: 4px;
        left: calc(50% + 6px);
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 8px;
        background: var(--warn);
        color: #1a1000;
        font-size: 10px;
        line-height: 16px;
        text-align: center;
      }

      /* common */
      .card {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .muted {
        color: var(--muted);
      }
      .faint {
        color: var(--faint);
      }
      .mono {
        font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace;
      }
      .lbl {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--faint);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn {
        height: 36px;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        font-weight: 700;
        display: inline-grid;
        place-items: center;
        padding: 0 12px;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.ghost {
        background: none;
        border-color: transparent;
        color: var(--muted);
      }
      .tag {
        font-size: 9.5px;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 4px;
        text-transform: uppercase;
        border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
        color: var(--accent);
      }
      .chips {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .chip {
        height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        font-size: 11.5px;
        font-weight: 600;
      }
      .chip.on {
        border-color: var(--border-strong);
        background: var(--surface-2);
        color: var(--text);
      }

      /* wallets */
      .total {
        padding: 14px;
        display: grid;
        gap: 2px;
        background: linear-gradient(135deg, #1a1606, var(--surface) 55%);
      }
      .total .big {
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -0.01em;
      }
      .wl {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .w {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 2px 10px;
        padding: 9px 10px;
      }
      .w .name {
        font-weight: 650;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .w .addr {
        font-size: 11.5px;
        color: var(--muted);
      }
      .w .bal {
        text-align: right;
        font-weight: 650;
      }
      .w .usd {
        text-align: right;
        font-size: 11px;
        color: var(--faint);
      }

      /* activity */
      .day {
        font-size: 11px;
        color: var(--faint);
        margin: 2px 0 -4px;
      }
      .act {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        gap: 2px 10px;
        align-items: center;
        padding: 9px 10px;
      }
      .ico {
        grid-row: span 2;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      .ico.b {
        background: color-mix(in srgb, var(--buy) 16%, transparent);
        color: var(--buy);
      }
      .ico.s {
        background: color-mix(in srgb, var(--sell) 16%, transparent);
        color: var(--sell);
      }
      .ico.x {
        background: color-mix(in srgb, var(--teal) 18%, transparent);
        color: var(--teal);
      }
      .ico.t {
        background: var(--surface-2);
        color: var(--muted);
      }
      .act .t1 {
        font-weight: 650;
      }
      .act .t2 {
        font-size: 11.5px;
        color: var(--muted);
      }
      .act .r1 {
        text-align: right;
        font-size: 11.5px;
        font-weight: 650;
      }
      .act .r2 {
        text-align: right;
        font-size: 11px;
        color: var(--faint);
      }
      .ok {
        color: var(--buy);
      }
      .pend {
        color: var(--warn);
      }
      .bad {
        color: var(--sell);
      }
      .cb {
        font-size: 9.5px;
        font-weight: 700;
        padding: 0 4px;
        border-radius: 3px;
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
        color: var(--muted);
        margin-left: 4px;
      }

      /* bridge */
      .leg {
        padding: 10px 12px;
        display: grid;
        gap: 8px;
      }
      .leg .amt {
        font-size: 22px;
        font-weight: 750;
      }
      .sel {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: var(--surface-2);
        font-weight: 650;
      }
      .swap {
        width: 32px;
        height: 32px;
        margin: -10px auto;
        border-radius: 50%;
        border: 1px solid var(--border-strong);
        background: var(--bg);
        display: grid;
        place-items: center;
        color: var(--muted);
        position: relative;
        z-index: 1;
      }
      .quote {
        padding: 10px 12px;
        display: grid;
        gap: 5px;
        font-size: 12px;
      }
      .quote .row span:last-child {
        margin-left: auto;
      }
      .note {
        font-size: 11px;
        color: var(--faint);
        text-align: center;
      }
      .max {
        font-size: 11px;
        font-weight: 700;
        color: var(--accent);
      }

      /* settings */
      .tabs {
        display: flex;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        overflow: hidden;
      }
      .tabs span {
        flex: 1;
        text-align: center;
        padding: 6px 0;
        color: var(--muted);
        font-weight: 600;
        background: var(--surface);
      }
      .tabs span.on {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .field {
        display: grid;
        gap: 5px;
      }
      .field label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .input {
        height: 34px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--surface);
        padding: 0 10px;
        display: flex;
        align-items: center;
        color: var(--text);
      }
      .input.ph {
        color: var(--faint);
      }
      .hint {
        font-size: 11px;
        color: var(--faint);
      }
      .new {
        font-size: 9.5px;
        font-weight: 800;
        color: #04140a;
        background: var(--buy);
        border-radius: 4px;
        padding: 0 5px;
        margin-left: 6px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .sdot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--buy);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--buy) 20%, transparent);
      }

      /* wallets v2 */
      .pills {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        min-height: 30px;
        flex: none;
        scrollbar-width: none;
      }
      .pill {
        flex: none;
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-weight: 650;
      }
      .pill small {
        font-size: 10px;
        color: var(--faint);
        font-weight: 700;
      }
      .pill.on {
        border-color: var(--accent);
        color: var(--text);
        background: color-mix(in srgb, var(--accent) 12%, var(--surface));
      }
      .pill .star {
        font-style: normal;
        color: var(--accent);
        font-size: 10px;
      }
      .pill.add {
        width: 28px;
        padding: 0;
        justify-content: center;
        border-style: dashed;
      }
      .total2 {
        padding: 12px;
        display: grid;
        gap: 4px;
        background: linear-gradient(135deg, #1a1606, var(--surface) 55%);
      }
      .total2 .wname {
        font-weight: 700;
      }
      .total2 .addr {
        font-size: 11.5px;
        color: var(--muted);
      }
      .total2 .big {
        font-size: 26px;
        font-weight: 750;
        letter-spacing: -0.01em;
        margin-top: 2px;
      }
      .more {
        font-size: 11.5px;
        color: var(--accent);
        font-weight: 650;
      }
      .toks {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
      }
      .tok {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 8px 2px;
        border-bottom: 1px solid var(--border);
      }
      .tok:last-child {
        border-bottom: 0;
      }
      .av {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
        color: #fff;
        font-size: 13px;
      }
      .tname,
      .tval {
        display: grid;
        font-weight: 650;
      }
      .tname small,
      .tval small {
        font-size: 11px;
        font-weight: 500;
        color: var(--faint);
      }
      .tval {
        text-align: right;
      }
      .dust {
        display: flex;
        align-items: center;
        padding: 8px 10px;
        border: 1px dashed var(--border-strong);
        border-radius: 8px;
        color: var(--faint);
        font-size: 12px;
      }
      .showlink {
        color: var(--muted);
        font-weight: 700;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .act2 {
        height: 30px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 650;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1 class="page">Celera popup — proposed layout</h1>
    <p class="lead">
      Static mockup (no logic). Bottom navigation with four tabs replaces the current single screen.
      Numbers are examples. Settings keeps today's General / Chains / Sites tabs; the Chains tab
      gains a WebSocket RPC field.
    </p>

    <!-- shared icon sprites -->
    <svg width="0" height="0" style="position: absolute">
      <symbol

    <div class="screens">
      <!-- 1. WALLETS -->
      <figure>
        <div class="pop">
          <div class="top">
            <span class="brand">Celera</span><span class="sp"></span>
            <span class="chainsel"
              ><span class="dot" style="background: #3b82f6"></span>Base<svg width="12" height="12">
                <use href="#i-chev" /></svg
            ></span>
            <span class="ib"
              ><svg width="16" height="16"><use href="#i-lock" /></svg
            ></span>
          </div>
          <div class="content">
            <div class="pills">
              <span class="pill">All<small>4</small></span>
              <span class="pill on">W1<i class="star">★</i></span>
              <span class="pill">W2</span>
              <span class="pill">W3</span>
              <span class="pill">W4</span>
              <span class="pill add">+</span>
            </div>

            <div class="card total2">
              <div class="row">
                <span class="wname">Wallet 1</span>
                <span class="addr mono">0xf297…3C10</span>
                <svg width="12" height="12" class="faint"><use href="#i-copy" /></svg>
                <span class="sp"></span>
                <span class="more">Manage</span>
              </div>
              <span class="big">$461.20</span>
              <span class="muted" style="font-size: 12px">0.1203 ETH + 3 tokens on Base</span>
            </div>

            <div class="row">
              <span class="lbl">Tokens</span><span class="sp"></span
              ><span class="faint" style="font-size: 11px">Sorted by value</span>
            </div>
            <ul class="toks">
              <li class="tok">
                <span class="av" style="background: #1d3b7a">Ξ</span>
                <span class="tname">ETH<small>Native</small></span>
                <span class="tval">$280.02<small>0.1203</small></span>
              </li>
              <li class="tok">
                <span class="av" style="background: #5b3a1a">B</span>
                <span class="tname">BRETT<small>Brett</small></span>
                <span class="tval">$96.40<small>1.2M</small></span>
              </li>
              <li class="tok">
                <span class="av" style="background: #3f2a6b">D</span>
                <span class="tname">DEGEN<small>Degen</small></span>
                <span class="tval">$41.12<small>85.3K</small></span>
              </li>
              <li class="tok">
                <span class="av" style="background: #123f3a">A</span>
                <span class="tname">AERO<small>Aerodrome</small></span>
                <span class="tval">$11.17<small>12.4</small></span>
              </li>
            </ul>
            <div class="dust">
              <span>7 small or unpriced tokens hidden</span><span class="sp"></span
              ><span class="showlink">Show</span>
            </div>

            <div class="actions">
              <span class="act2">+ New</span><span class="act2">Import</span
              ><span class="act2">Distribute</span><span class="act2">Collect</span>
            </div>
          </div>
          <nav class="nav">
            <a class="on"
              ><svg><use href="#i-wallet" /></svg>Wallets</a
            >
            <a
              ><svg><use href="#i-activity" /></svg>Activity<span class="badge">1</span></a
            >
            <a
              ><svg><use href="#i-bridge" /></svg>Bridge</a
            >
            <a
              ><svg><use href="#i-settings" /></svg>Settings</a
            >
          </nav>
        </div>
